name: 'Setup PowerShell and GitHub CLI'
description: 'Install PowerShell 7 and GitHub CLI on Linux runners if not already present'
runs:
  using: 'composite'
  steps:
    - name: Install PowerShell
      shell: bash
      run: |
        if ! command -v pwsh >/dev/null 2>&1; then
          echo "Installing PowerShell 7..."
          curl -fsSL https://github.com/PowerShell/PowerShell/releases/download/v7.4.7/powershell-7.4.7-linux-x64.tar.gz -o /tmp/pwsh.tar.gz
          sudo mkdir -p /opt/microsoft/powershell/7
          sudo tar zxf /tmp/pwsh.tar.gz -C /opt/microsoft/powershell/7
          sudo chmod +x /opt/microsoft/powershell/7/pwsh
          sudo ln -sf /opt/microsoft/powershell/7/pwsh /usr/bin/pwsh
          rm -f /tmp/pwsh.tar.gz
          echo "PowerShell installed: $(pwsh -Version)"
        fi

    - name: Install GitHub CLI
      shell: bash
      run: |
        if ! command -v gh >/dev/null 2>&1; then
          echo "Installing GitHub CLI..."
          curl -fsSL https://github.com/cli/cli/releases/download/v2.67.0/gh_2.67.0_linux_amd64.tar.gz | sudo tar -zxf - -C /usr/local/bin --strip-components=2 gh_2.67.0_linux_amd64/bin/gh
          echo "GitHub CLI installed: $(gh --version | head -1)"
        fi
